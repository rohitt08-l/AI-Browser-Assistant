name: CI/CD

# Pull requests: lint, test, build (no deploy).
# Push / merge to main: the same checks, then deploy the backend to Render
# and publish the packaged Chrome extension as a GitHub Release.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check backend tests
          ruff format --check backend tests
      - name: Tests
        run: pytest -q

  extension:
    name: Extension checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-extension.sh
      - run: scripts/package-extension.sh
      - uses: actions/upload-artifact@v4
        with:
          name: extension-dev
          path: dist/*.zip
          retention-days: 7

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg APP_COMMIT=${{ github.sha }} -t ai-browser-assistant:ci .
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 -e GROQ_API_KEY=dummy ai-browser-assistant:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1

  deploy:
    name: Deploy backend to Render
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [backend, extension, docker]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.BACKEND_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL is not set (Render > service > Settings > Deploy Hook)."
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Deploy triggered for ${GITHUB_SHA}"

      - name: Wait until the new version is live
        if: vars.BACKEND_URL != ''
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          # Free-tier builds can take several minutes; poll /health for this commit.
          deadline=$((SECONDS + 1200))
          while [ $SECONDS -lt $deadline ]; do
            commit=$(curl -fsS --max-time 60 "${BACKEND_URL%/}/health" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "Live: ${BACKEND_URL} is serving ${GITHUB_SHA}"
              exit 0
            fi
            echo "Waiting... (serving: ${commit:-unreachable})"
            sleep 20
          done
          echo "::error::Timed out waiting for ${GITHUB_SHA} to go live. Check the Render dashboard logs."
          exit 1

  release-extension:
    name: Package & release extension
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package with production backend URL
        id: pkg
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          zip_path=$(scripts/package-extension.sh "$BACKEND_URL" dist)
          version=$(python3 -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')
          echo "zip=$zip_path" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: extension-v${{ steps.pkg.outputs.version }}
          path: ${{ steps.pkg.outputs.zip }}
      - name: Create GitHub Release (only when the manifest version changes)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pkg.outputs.version }}
          ZIP: ${{ steps.pkg.outputs.zip }}
        run: |
          tag="extension-v${VERSION}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists; bump \"version\" in extension/manifest.json to publish a new one."
          else
            gh release create "$tag" "$ZIP" --target "$GITHUB_SHA" \
              --title "Extension v${VERSION}" \
              --notes "Chrome extension build for commit ${GITHUB_SHA}. Upload the zip to the Chrome Web Store, or unzip and use Load unpacked."
          fi
